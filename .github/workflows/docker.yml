# Build and push the demo site image to GHCR on every push to main.
# The live host pulls ghcr.io/nergy101/mistral-playground:latest and restarts
# the container (docker compose), so merging to main ships the site.
# MISTRAL_API_KEY is never baked into the image — it is passed at runtime.
name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mistral-playground:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
